[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24.13.0"
  NPM_FLAGS = "--include=dev"

# Production remains noindex until SITE_INDEXABLE=true is set in the hosting UI
# after the custom domain is connected and the live release is verified.
[context.deploy-preview.environment]
  SITE_INDEXABLE = "false"

[context.branch-deploy.environment]
  SITE_INDEXABLE = "false"

[context.dev.environment]
  SITE_INDEXABLE = "false"
